# ============================================================================
# PR CI：拉取请求打开/同步时自动跑验证
# ============================================================================
# 用途：拦截坏代码在合并前。
#
# 设计要点：
#   - PR 打开/同步：跑质量门禁（typecheck + go build + go vet）
#   - 手动 workflow_dispatch：只跑 CI（debug 用），不部署
#   - 主分支 push 部署走 deploy.yml（3 台 VPS 全量）—— 本 workflow 与之平行
#
# 触发：
#   - PR 打开 / 同步 / 重开时自动跑
#   - workflow_dispatch 也可手动触发（debug 用）
# ============================================================================

name: PR CI

on:
  pull_request:
    branches: [main]
    # paths 白名单：README / docs / 图片等非代码改动不跑 CI
    paths:
      - 'server/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pr-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR 同时多条 push 时只跑最新的（同一 PR 反复 push 时取消上一次的 CI）
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ─────────── 前端验证：typecheck + 生产构建 ───────────
  verify-frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      # pull_request 默认检出 GitHub 生成的 merge commit，验证合并后实际会进入 main 的代码。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # CLAUDE.md 质量把关：pnpm -C web typecheck 零错误
      - name: Install frontend dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm -C web typecheck
      - name: Frontend production build
        run: pnpm -C web build

  # ─────────── 后端验证：vet + test + Linux 构建 + 健康检查 ───────────
  verify-backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test -count=1 ./...
      - name: Build production backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o lumen-ci ./server/
      - name: Backend health smoke test
        shell: bash
        run: |
          # APP_ENV=development：冒烟用全新临时库，dev 模式让空 APP_PASSWORD 回退 admin（生产模式会拒空密码启动）
          # 显式 set +e：GitHub 默认 --noprofile --norc -e -o pipefail，curl 失败 + pipefail 会提前退出并吞掉 cat 的 server 日志
          set +e
          LOG="$RUNNER_TEMP/lumen-ci.log"
          APP_ENV=development PORT=18081 DB_PATH="$RUNNER_TEMP/lumen-ci.db" JWT_SECRET=ci-test-secret ./lumen-ci > "$LOG" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..10}; do
            if curl -fsS http://127.0.0.1:18081/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "✅ /api/health OK"
              exit 0
            fi
            # server 进程已死（启动崩溃）就提前终止循环拿日志，不再傻等
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "❌ server 进程已退出（启动崩溃）"
              break
            fi
            sleep 1
          done
          echo "---- server 启动日志 ($LOG) ----"
          cat "$LOG" 2>/dev/null || echo "(log 文件不存在)"
          echo "---- server 进程状态 ----"
          if kill -0 "$server_pid" 2>/dev/null; then
            echo "server 仍在运行 (PID=$server_pid)"
            echo "---- 末尾重试 curl ----"
            curl -fsS http://127.0.0.1:18081/api/health || echo "curl 失败 exit=$?"
          else
            wait "$server_pid" 2>/dev/null
            rc=$?
            echo "server 已退出，exit code=$rc"
          fi
          exit 1

  # ─────────── 汇总（让 GitHub 顶层 checks 一次性给出整体状态） ───────────
  # 避免 reviewer 看到「前/后端各一个 check」分两个红勾而误以为二者独立、
  # 必须分别点开。本 job 单一 status，便于在 PR 页一眼看穿。
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    needs: [verify-frontend, verify-backend]
    if: always()
    steps:
      - name: Aggregate PR status
        run: |
          if [ "${{ needs.verify-frontend.result }}" = "success" ] && \
             [ "${{ needs.verify-backend.result }}" = "success" ]; then
            echo "✅ PR CI 全绿：前端 typecheck + 后端 build/vet 通过，可合并"
            exit 0
          fi
          echo "❌ PR CI 失败："
          echo "  verify-frontend = ${{ needs.verify-frontend.result }}"
          echo "  verify-backend  = ${{ needs.verify-backend.result }}"
          exit 1
